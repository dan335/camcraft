[workspace]
resolver = "3"
members = ["crates/*"]
# A bare `cargo run` opens the app. This also narrows a bare `cargo build` or `cargo
# test` to the app; scripts/check.sh names its crates, so it is unaffected.
default-members = ["crates/camcraft-gui"]
# Patched third-party crates, see [patch.crates-io] below. Not ours to lint or test.
exclude = ["vendor"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.98"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/dan335/camcraft"
authors      = ["dan335"]

[workspace.dependencies]
# internal — the dependency DAG is enforced per-crate, see README
camcraft-geom   = { path = "crates/camcraft-geom",   version = "0.1.0" }
camcraft-import = { path = "crates/camcraft-import", version = "0.1.0" }
camcraft-sim    = { path = "crates/camcraft-sim",    version = "0.1.0" }
camcraft-core   = { path = "crates/camcraft-core",   version = "0.1.0" }
camcraft-post   = { path = "crates/camcraft-post",   version = "0.1.0" }
camcraft-session = { path = "crates/camcraft-session", version = "0.1.0" }

# external
bytemuck           = { version = "1", features = ["derive"] }
eframe             = "0.36"
egui_extras        = "0.36"
egui-file-dialog   = { version = "0.15", default-features = false, features = ["serde"] }
egui_kittest       = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }
clap               = { version = "4.6", features = ["derive"] }
clipper2-rust      = "1.2"
csv                = "1.4"
directories        = "6"
glam               = { version = "0.33", features = ["serde"] }
# STEP backend, see docs/decisions/0001-step-backend.md. Builds OpenCascade from
# source: cmake and a C++ toolchain are prerequisites. Only camcraft-import pays
# for it, and through camcraft-session the two binaries; the engine crates never.
opencascade        = "0.3"
parry3d-f64        = "0.31"
proptest           = "1.11"
rayon              = "1.12"
serde              = { version = "1.0", features = ["derive"] }
stl_io             = "0.11"
thiserror          = "2.0"
toml               = "1.1"
tracing            = "0.1"
tracing-subscriber = "0.3"

# Correctness rules from the plan, enforced by the compiler rather than by memory.
[workspace.lints.rust]
unsafe_code  = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used         = "deny"
expect_used         = "deny"
panic               = "deny"
indexing_slicing    = "warn"
float_cmp           = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"

[profile.release]
lto           = "thin"
codegen-units = 1

# Geometry work is unusably slow in an unoptimised debug build; tests included.
[profile.dev.package."*"]
opt-level = 2

# The same holds for our own geometry crates: their tests spend their time in
# drop-cutting, simulation and roughing, and ran about twice as fast optimised
# (measured: core's unit tests 63-89 s -> 34 s, pipeline 57 s -> 24 s, job 48 s
# -> 20 s, oracle 37 s -> 16 s). Debug assertions and debug info stay on, so a
# failing test still reports properly; only the compile gets a few seconds longer.
[profile.dev.package.camcraft-geom]
opt-level = 2
[profile.dev.package.camcraft-sim]
opt-level = 2
[profile.dev.package.camcraft-core]
opt-level = 2

# opencascade 0.3.0 does not build with MSVC: it assumes OpenCascade's `Handle_X` is
# an alias of `opencascade::handle<X>`, which holds everywhere but Visual Studio,
# where it is a derived class. vendor/ holds the crates.io 0.3.0 sources with upstream
# PR #234 applied (https://github.com/bschwind/opencascade-rs/pull/234, at 00b4505),
# which changes nothing on GCC or Clang. vendor/opencascade also records how many
# triangles each B-rep face gave (`Mesh::face_triangles`), which is how a triangle
# is traced back to the face a person picks; upstream has no equivalent. Delete
# vendor/ and this block only once a release includes both.
[patch.crates-io]
opencascade     = { path = "vendor/opencascade" }
opencascade-sys = { path = "vendor/opencascade-sys" }
