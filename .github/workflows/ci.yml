name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --all-targets
      - name: doc
        run: cargo doc --workspace --no-deps

  determinism:
    name: deterministic output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Identical inputs must produce identical bytes on any core count. Without
      # this, golden-file tests are flaky and regressions become invisible.
      - name: single-threaded vs multi-threaded
        run: |
          RAYON_NUM_THREADS=1 cargo test --workspace -- --include-ignored
          RAYON_NUM_THREADS=8 cargo test --workspace -- --include-ignored

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Performance regressions surface here, rather than at the point where
      # they would tempt a decimation shortcut.
      - name: bench
        run: cargo bench --workspace --no-fail-fast
