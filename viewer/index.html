<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>camcraft inspector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
  /* Role colours come from the design system's toolpath palette so the inspector
     reads the same as other G-code viewers. Retract, ramp and link are not in the
     system: retract is deliberately neutral because it is a safe move that should
     not compete for attention, and an unresolved link is drawn near-white so it
     reads as "unclassified", which is exactly what it is. */
  :root {
    --role-cut:var(--path-cut);
    --role-rapid:var(--path-rapid);
    --role-plunge:var(--path-plunge);
    --role-lead:var(--path-lead);
    --role-ramp:var(--path-lead);
    --role-retract:var(--gray-7);
    --role-link:var(--gray-10);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text-1);
    font: var(--weight-regular) var(--text-base)/var(--leading-normal) var(--font-sans);
    font-feature-settings: var(--font-numeric);
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-columns: var(--panel) 1fr; overflow: hidden;
  }
  #side {
    background: var(--surface-1); border-right: var(--border-width, 1px) solid var(--border);
    padding: var(--space-5); overflow-y: auto;
    display: flex; flex-direction: column; gap: var(--space-5);
  }
  #stage { position: relative; }
  canvas { display: block; }
  h1 {
    font: var(--weight-medium) var(--text-md)/var(--leading-snug) var(--font-mono);
    margin: 0; letter-spacing: var(--tracking-tight); color: var(--text-1);
  }
  h2 {
    font: var(--weight-medium) var(--text-xs)/var(--leading-snug) var(--font-mono);
    margin: 0 0 var(--space-3); color: var(--text-3);
    text-transform: uppercase; letter-spacing: var(--tracking-wide);
  }
  .card {
    border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: var(--space-4); background: var(--surface-2);
  }
  #drop {
    border: 1px dashed var(--border-strong); border-radius: var(--radius-md);
    padding: var(--space-6) var(--space-4); text-align: center;
    color: var(--text-3); font-size: var(--text-sm); cursor: pointer;
    transition: border-color var(--dur-base) var(--ease-out),
                color var(--dur-base) var(--ease-out);
  }
  #drop:hover { border-color: var(--border-focus); color: var(--text-2); }
  #drop.hot { border-color: var(--accent); color: var(--accent); }
  #drop b { color: var(--text-1); font-weight: var(--weight-medium); }

  /* Diagnostic, after the design system's component: a weighted left edge, a
     level, a stable code, then the message. The code matters — a finding you can
     quote is a finding you can look up. */
  .diag {
    display: grid; grid-template-columns: 52px 1fr; gap: 0 var(--space-4);
    padding: var(--space-3) var(--space-4);
    border: 1px solid var(--border); border-left-width: 2px;
    border-radius: var(--radius-sm); margin-bottom: var(--space-2);
    font-size: var(--text-sm); background: var(--surface-3);
  }
  .diag .lvl {
    font: var(--weight-medium) var(--text-xs)/var(--leading-snug) var(--font-mono);
    letter-spacing: var(--tracking-wide); padding-top: 2px;
  }
  .diag code {
    font-family: var(--font-mono); font-size: var(--text-xs);
    color: var(--text-4); margin-right: var(--space-3);
  }
  .diag .msg { color: var(--text-1); }
  .diag.fail { border-left-color: var(--verdict-fail-edge); background: var(--verdict-fail-bg); }
  .diag.fail .lvl { color: var(--err); text-transform: uppercase; }
  .diag.warn { border-left-color: var(--verdict-warn-edge); background: var(--verdict-warn-bg); }
  .diag.warn .lvl { color: var(--warn); }
  .diag.note { border-left-color: var(--verdict-note-edge); }
  .diag.note .lvl { color: var(--info); }
  .diag.pass { border-left-color: var(--verdict-pass-edge); }
  .diag.pass .lvl { color: var(--text-4); }
  .diag.pass .msg { color: var(--text-2); }

  table { width: 100%; border-collapse: collapse;
          font-family: var(--font-mono); font-size: var(--text-sm); }
  td { padding: var(--space-1) 0; vertical-align: top; }
  td:first-child { color: var(--text-3); padding-right: var(--space-3);
                   white-space: nowrap; font-family: var(--font-sans); }
  td:last-child { text-align: right; color: var(--text-1); }
  label { display: flex; align-items: center; gap: var(--space-3);
          padding: var(--space-1) 0; cursor: pointer; font-size: var(--text-sm);
          min-height: var(--control-sm); }
  label:hover { color: var(--text-1); }
  input[type=checkbox] { accent-color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .sw { width: 10px; height: 10px; border-radius: var(--radius-sm); flex: none; }
  .count { margin-left: auto; color: var(--text-3); font-family: var(--font-mono);
           font-size: var(--text-xs); }
  #hint {
    position: absolute; left: var(--space-4); bottom: var(--space-4);
    color: var(--text-4); font-size: var(--text-xs);
    font-family: var(--font-mono); pointer-events: none;
  }
  .muted { color: var(--text-3); }
</style>
</head>
<body>
<div id="side">
  <h1>camcraft inspector</h1>
  <div id="drop">drop a <b>.json</b> from<br><span class="muted">camcraft inspect</span><br>or click to choose</div>
  <input id="file" type="file" accept=".json" hidden>

  <div class="card" id="checks-card" hidden>
    <h2>Checks</h2>
    <div id="checks"></div>
  </div>

  <div class="card" id="meta-card" hidden>
    <h2>Job</h2>
    <table id="meta"></table>
  </div>

  <div class="card" id="layers-card" hidden>
    <h2>Show</h2>
    <div id="layers"></div>
    <label style="margin-top:8px"><input type="checkbox" id="showPart" checked><span>part surface</span></label>
    <label><input type="checkbox" id="showClear"><span>clearance plane</span></label>
  </div>

  <div class="card" id="scrub-card" hidden>
    <h2>Move order</h2>
    <input type="range" id="scrub" min="1" max="1" value="1">
    <table><tr><td>showing</td><td id="scrubLabel">–</td></tr></table>
  </div>
</div>

<div id="stage">
  <div id="hint">drag to orbit · wheel to zoom · shift-drag to pan · R resets</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const ROLES = ['cut','rapid','plunge','retract','lead','ramp','link'];
const COLOR = {};
for (const r of ROLES) {
  COLOR[r] = getComputedStyle(document.documentElement)
    .getPropertyValue('--role-' + r).trim() || '#8B909D';
}

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0B0C0E);   // --bg
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.3);
key.position.set(0.6, -1, 1.4);
scene.add(key);

// Z-up, matching the engine's convention. Getting this wrong would make every
// reading of the picture wrong, so it is set once here and never flipped.
camera.up.set(0, 0, 1);

let group = null, home = null;

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();

addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') frame(); });

function frame() {
  if (!home) return;
  const { center, radius } = home;
  controls.target.copy(center);
  camera.position.set(center.x + radius * 1.4, center.y - radius * 1.7, center.z + radius * 1.2);
  camera.near = radius / 500; camera.far = radius * 100;
  camera.updateProjectionMatrix();
}

// ---- loading -------------------------------------------------------------

const drop = document.getElementById('drop');
const filePick = document.getElementById('file');
drop.onclick = () => filePick.click();
filePick.onchange = e => { if (e.target.files[0]) read(e.target.files[0]); };
for (const [ev, on] of [['dragover', true], ['dragleave', false], ['drop', false]]) {
  drop.addEventListener(ev, e => {
    e.preventDefault();
    drop.classList.toggle('hot', on);
    if (ev === 'drop' && e.dataTransfer.files[0]) read(e.dataTransfer.files[0]);
  });
}
// ?data=<url> loads directly, which makes a view reproducible and lets the
// inspector be driven from a script.
const q = new URLSearchParams(location.search).get('data');
if (q) {
  fetch(q).then(r => r.json()).then(d => build(d, q.split('/').pop()))
          .catch(e => { drop.textContent = 'could not load ' + q + ': ' + e.message; });
}

addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) read(e.dataTransfer.files[0]);
});

function read(file) {
  drop.textContent = 'reading ' + file.name + '…';
  const fr = new FileReader();
  fr.onload = () => {
    try { build(JSON.parse(fr.result), file.name); }
    catch (err) { drop.textContent = 'could not read: ' + err.message; }
  };
  fr.readAsText(file);
}

// ---- building ------------------------------------------------------------

let segments = [];   // { role, a, b } in order
let lineMeshes = {};

function build(data, name) {
  if (group) { scene.remove(group); disposeAll(group); }
  group = new THREE.Group();
  scene.add(group);
  drop.innerHTML = '<b>' + name + '</b><br><span class="muted">click to load another</span>';

  const meta = data.meta || {};
  const part = data.part || {};
  const path = data.path || [];

  // Part surface.
  const tri = Float32Array.from(part.triangles || []);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(tri, 3));
  geo.computeVertexNormals();
  const partMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: 0x585D6A, roughness: 0.85, metalness: 0.0,
    side: THREE.DoubleSide, flatShading: true,
  }));
  group.add(partMesh);

  // Toolpath, split per role so each can be toggled and coloured.
  segments = [];
  let at = null;
  for (const m of path) {
    const to = new THREE.Vector3(m.to[0], m.to[1], m.to[2]);
    if (at) segments.push({ role: m.role, a: at, b: to });
    at = to;
  }

  lineMeshes = {};
  for (const role of ROLES) {
    const pts = [];
    for (const s of segments) if (s.role === role) pts.push(s.a, s.b);
    if (!pts.length) continue;
    const g = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineBasicMaterial({ color: new THREE.Color(COLOR[role]) });
    const mesh = new THREE.LineSegments(g, mat);
    mesh.userData.role = role;
    lineMeshes[role] = mesh;
    group.add(mesh);
  }

  // Clearance plane, so "is that rapid high enough" is answerable by eye.
  const min = part.min || [0,0,0], max = part.max || [0,0,0];
  const cz = meta.clearance_z;
  if (typeof cz === 'number') {
    const w = (max[0]-min[0]) * 1.3 || 10, d = (max[1]-min[1]) * 1.3 || 10;
    const pg = new THREE.PlaneGeometry(w, d);
    const pm = new THREE.Mesh(pg, new THREE.MeshBasicMaterial({
      color: 0x4FD1FF, transparent: true, opacity: 0.08, side: THREE.DoubleSide,
    }));
    pm.position.set((min[0]+max[0])/2, (min[1]+max[1])/2, cz);
    pm.visible = document.getElementById('showClear').checked;
    pm.userData.clearance = true;
    group.add(pm);
  }

  const center = new THREE.Vector3((min[0]+max[0])/2, (min[1]+max[1])/2, (min[2]+max[2])/2);
  const radius = Math.max(max[0]-min[0], max[1]-min[1], max[2]-min[2]) || 10;
  home = { center, radius };
  frame();

  document.getElementById('showPart').onchange = e => { partMesh.visible = e.target.checked; };
  document.getElementById('showClear').onchange = e => {
    group.children.forEach(c => { if (c.userData.clearance) c.visible = e.target.checked; });
  };

  renderChecks(data);
  renderMeta(meta, part, path);
  renderLayers();
  renderScrub();
}

function disposeAll(obj) {
  obj.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) o.material.dispose();
  });
}

// ---- verification --------------------------------------------------------

// These are re-derived here from the geometry, not copied from the engine's own
// report. A viewer that only echoed the producer's opinion of its output would
// agree with it even when both were wrong.
function renderChecks(data) {
  const meta = data.meta || {};
  const path = data.path || [];
  const cz = meta.clearance_z;
  const out = [];
  const add = (level, code, message, location) => out.push({ level, code, message, location });

  // CC1xx are hard failures: the program must not be run.
  const links = path.filter(m => m.role === 'link').length;
  links === 0
    ? add('pass', 'CC101', 'no unresolved links')
    : add('fail', 'CC101', links + ' unresolved link(s) — path is NOT machinable');

  if (typeof cz === 'number') {
    let low = 0, worst = Infinity, prev = null;
    for (const m of path) {
      if (m.role === 'rapid') {
        for (const pt of [prev, m]) {
          if (pt && pt.to[2] < cz - 1e-6) { low++; worst = Math.min(worst, pt.to[2]); }
        }
      }
      prev = m;
    }
    low === 0
      ? add('pass', 'CC102', 'every rapid is at or above clearance', cz.toFixed(2) + ' mm')
      : add('fail', 'CC102', low + ' rapid endpoint(s) below clearance',
            'lowest ' + worst.toFixed(2) + ' mm of ' + cz.toFixed(2));
  }

  let diagonal = 0, prev = null;
  for (const m of path) {
    if (prev && (m.role === 'plunge' || m.role === 'retract')) {
      if (Math.hypot(m.to[0] - prev.to[0], m.to[1] - prev.to[1]) > 1e-6) diagonal++;
    }
    prev = m;
  }
  diagonal === 0
    ? add('pass', 'CC103', 'plunges and retracts are vertical')
    : add('fail', 'CC103', diagonal + ' plunge/retract move(s) travel sideways',
          'drags the cutter through the wall it just cut');

  const nofeed = path.filter(m => m.role !== 'rapid' && !(m.feed > 0)).length;
  const rapidfeed = path.filter(m => m.role === 'rapid' && m.feed != null).length;
  nofeed === 0 && rapidfeed === 0
    ? add('pass', 'CC104', 'feed rates are consistent with move roles')
    : add('fail', 'CC104', nofeed + ' feeding move(s) without a feed, ' +
          rapidfeed + ' rapid(s) with one');

  // Re-derived here, not read from meta. A viewer that only echoed the producer's
  // own report would agree with it even when both were wrong.
  let steep = 0, deepest = 0;
  prev = null;
  for (const m of path) {
    if (prev && m.role === 'cut') {
      const drop = prev.to[2] - m.to[2];
      const flat = Math.hypot(m.to[0] - prev.to[0], m.to[1] - prev.to[1]);
      if (drop > 0 && drop > flat) { steep++; deepest = Math.max(deepest, drop); }
    }
    prev = m;
  }
  steep === 0
    ? add('pass', 'CC105', 'no cutting move descends faster than it advances')
    : add('fail', 'CC105', steep + ' cutting move(s) are really plunges',
          'deepest ' + deepest.toFixed(2) + ' mm at cutting feed — will break cutters');

  // CC2xx are advisories: look, then decide.
  if (meta.refinement_limited > 0) {
    add('warn', 'CC201', meta.refinement_limited + ' span(s) hit the refinement limit',
        'path is coarser than the requested tolerance');
  }
  if (meta.suspicious_plunges > 0) {
    add('warn', 'CC202', meta.suspicious_plunges + ' plunge(s) do not start above the surface');
  }
  if (meta.discontinuities > 0) {
    add('note', 'CC203', meta.discontinuities + ' span(s) stopped at a surface discontinuity',
        'expected wherever the part has vertical walls');
  }
  for (const w of (meta.warnings || [])) {
    if (!/steeply|refinement limit|do not start above/.test(w)) add('warn', 'CC299', w);
  }

  const failed = out.filter(d => d.level === 'fail').length;
  const banner = failed > 0
    ? '<div class="diag fail"><span class="lvl">HALT</span><span class="msg">' +
      failed + ' blocking failure(s). Do not run this program.</span></div>'
    : '';

  document.getElementById('checks').innerHTML = banner + out.map(d =>
    '<div class="diag ' + d.level + '">' +
      '<span class="lvl">' + d.level + '</span>' +
      '<div><div class="msg"><code>' + d.code + '</code>' + esc(d.message) + '</div>' +
      (d.location ? '<div class="muted" style="font-family:var(--font-mono);font-size:var(--text-xs);margin-top:2px">' +
        esc(d.location) + '</div>' : '') +
    '</div></div>').join('');
  document.getElementById('checks-card').hidden = false;
}

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));
}

function renderMeta(meta, part, path) {
  const rows = [
    ['model', (meta.model || '').split(/[\\/]/).pop()],
    ['file units', meta.units],
    ['size', part.min && part.max
      ? (part.max[0]-part.min[0]).toFixed(1) + ' × ' +
        (part.max[1]-part.min[1]).toFixed(1) + ' × ' +
        (part.max[2]-part.min[2]).toFixed(1) + ' mm' : '–'],
    ['triangles', (part.triangle_count ?? 0).toLocaleString()],
    ['tool', meta.tool + ' ⌀' + (meta.tool_radius * 2).toFixed(2)],
    ['stock r/a', meta.stock_radial + ' / ' + meta.stock_axial + ' mm'],
    ['stepover', meta.stepover + ' mm'],
    ['tolerance', meta.tolerance + ' mm'],
    ['clearance Z', (meta.clearance_z ?? 0).toFixed(2) + ' mm'],
    ['passes', meta.passes],
    ['moves', (path.length || 0).toLocaleString()],
    ['cutting', (meta.cutting_length_mm ?? 0).toFixed(0) + ' mm'],
  ];
  document.getElementById('meta').innerHTML = rows
    .map(([k, v]) => '<tr><td>' + esc(k) + '</td><td>' + esc(v ?? '–') + '</td></tr>').join('');
  document.getElementById('meta-card').hidden = false;
}

function renderLayers() {
  const counts = {};
  for (const s of segments) counts[s.role] = (counts[s.role] || 0) + 1;
  const el = document.getElementById('layers');
  el.innerHTML = ROLES.filter(r => counts[r]).map(r =>
    '<label><input type="checkbox" data-role="' + r + '" checked>' +
    '<span class="sw" style="background:' + COLOR[r] + '"></span>' +
    '<span>' + r + '</span>' +
    '<span style="margin-left:auto;color:var(--dim)">' + counts[r].toLocaleString() + '</span></label>'
  ).join('');
  el.querySelectorAll('input').forEach(cb => {
    cb.onchange = () => {
      const m = lineMeshes[cb.dataset.role];
      if (m) m.visible = cb.checked;
    };
  });
  document.getElementById('layers-card').hidden = false;
}

// Scrubbing through move order is how you catch a path that is geometrically
// fine but travels in a senseless sequence.
function renderScrub() {
  const scrub = document.getElementById('scrub');
  const label = document.getElementById('scrubLabel');
  scrub.min = 1; scrub.max = Math.max(1, segments.length); scrub.value = scrub.max;
  const apply = () => {
    const n = +scrub.value;
    for (const role of ROLES) {
      const mesh = lineMeshes[role];
      if (!mesh) continue;
      let shown = 0;
      for (let i = 0; i < n; i++) if (segments[i].role === role) shown++;
      mesh.geometry.setDrawRange(0, shown * 2);
    }
    label.textContent = n.toLocaleString() + ' / ' + segments.length.toLocaleString();
  };
  scrub.oninput = apply;
  apply();
  document.getElementById('scrub-card').hidden = false;
}
</script>
</body>
</html>
