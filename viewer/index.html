<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>camcraft inspector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
  /* Role colours come from the design system's toolpath palette so the inspector
     reads the same as other G-code viewers. Retract, ramp and link are not in the
     system: retract is deliberately neutral because it is a safe move that should
     not compete for attention, and an unresolved link is drawn near-white so it
     reads as "unclassified", which is exactly what it is. */
  :root {
    --role-cut:var(--path-cut);
    --role-rapid:var(--path-rapid);
    --role-plunge:var(--path-plunge);
    --role-lead:var(--path-lead);
    --role-ramp:var(--path-lead);
    --role-retract:var(--gray-7);
    --role-link:var(--gray-10);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text-1);
    font: var(--weight-regular) var(--text-base)/var(--leading-normal) var(--font-sans);
    font-feature-settings: var(--font-numeric);
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-columns: var(--panel) 1fr; overflow: hidden;
  }
  #side {
    background: var(--surface-1); border-right: var(--border-width, 1px) solid var(--border);
    padding: var(--space-5); overflow-y: auto;
    display: flex; flex-direction: column; gap: var(--space-5);
  }
  /* The canvas is sized by CSS, never by its pixel buffer. The renderer sets the
     buffer to CSS size times devicePixelRatio; left to lay out at that size, a
     canvas on a 2x display pushes the grid column wider, the observer resizes it
     again, and the scene ends up drawn off the right-hand edge. */
  #stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  h1 {
    font: var(--weight-medium) var(--text-md)/var(--leading-snug) var(--font-mono);
    margin: 0; letter-spacing: var(--tracking-tight); color: var(--text-1);
  }
  h2 {
    font: var(--weight-medium) var(--text-xs)/var(--leading-snug) var(--font-mono);
    margin: 0 0 var(--space-3); color: var(--text-3);
    text-transform: uppercase; letter-spacing: var(--tracking-wide);
  }
  .card {
    border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: var(--space-4); background: var(--surface-2);
  }
  #drop {
    border: 1px dashed var(--border-strong); border-radius: var(--radius-md);
    padding: var(--space-6) var(--space-4); text-align: center;
    color: var(--text-3); font-size: var(--text-sm); cursor: pointer;
    transition: border-color var(--dur-base) var(--ease-out),
                color var(--dur-base) var(--ease-out);
  }
  #drop:hover { border-color: var(--border-focus); color: var(--text-2); }
  #drop.hot { border-color: var(--accent); color: var(--accent); }
  #drop b { color: var(--text-1); font-weight: var(--weight-medium); }

  /* Diagnostic, after the design system's component: a weighted left edge, a
     level, a stable code, then the message. The code matters — a finding you can
     quote is a finding you can look up. */
  .diag {
    display: grid; grid-template-columns: 52px 1fr; gap: 0 var(--space-4);
    padding: var(--space-3) var(--space-4);
    border: 1px solid var(--border); border-left-width: 2px;
    border-radius: var(--radius-sm); margin-bottom: var(--space-2);
    font-size: var(--text-sm); background: var(--surface-3);
  }
  .diag .lvl {
    font: var(--weight-medium) var(--text-xs)/var(--leading-snug) var(--font-mono);
    letter-spacing: var(--tracking-wide); padding-top: 2px;
  }
  .diag code {
    font-family: var(--font-mono); font-size: var(--text-xs);
    color: var(--text-4); margin-right: var(--space-3);
  }
  .diag .msg { color: var(--text-1); }
  .diag.fail { border-left-color: var(--verdict-fail-edge); background: var(--verdict-fail-bg); }
  .diag.fail .lvl { color: var(--err); text-transform: uppercase; }
  .diag.warn { border-left-color: var(--verdict-warn-edge); background: var(--verdict-warn-bg); }
  .diag.warn .lvl { color: var(--warn); }
  .diag.note { border-left-color: var(--verdict-note-edge); }
  .diag.note .lvl { color: var(--info); }
  .diag.pass { border-left-color: var(--verdict-pass-edge); }
  .diag.pass .lvl { color: var(--text-4); }
  .diag.pass .msg { color: var(--text-2); }

  table { width: 100%; border-collapse: collapse;
          font-family: var(--font-mono); font-size: var(--text-sm); }
  td { padding: var(--space-1) 0; vertical-align: top; }
  td:first-child { color: var(--text-3); padding-right: var(--space-3);
                   white-space: nowrap; font-family: var(--font-sans); }
  td:last-child { text-align: right; color: var(--text-1); }
  label { display: flex; align-items: center; gap: var(--space-3);
          padding: var(--space-1) 0; cursor: pointer; font-size: var(--text-sm);
          min-height: var(--control-sm); }
  label:hover { color: var(--text-1); }
  input[type=checkbox] { accent-color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .sw { width: 10px; height: 10px; border-radius: var(--radius-sm); flex: none; }
  .count { margin-left: auto; color: var(--text-3); font-family: var(--font-mono);
           font-size: var(--text-xs); }
  #hint {
    position: absolute; left: var(--space-4); bottom: var(--space-4);
    color: var(--text-4); font-size: var(--text-xs);
    font-family: var(--font-mono); pointer-events: none;
  }
  .muted { color: var(--text-3); }
  .op-head {
    display: flex; align-items: baseline; gap: var(--space-3);
    font: var(--weight-medium) var(--text-sm)/var(--leading-snug) var(--font-mono);
    color: var(--text-1); margin: var(--space-4) 0 var(--space-2);
  }
  .op-head:first-child { margin-top: 0; }
  .op-head .muted { font-weight: var(--weight-regular); font-size: var(--text-xs); }
  .op + .op { border-top: 1px solid var(--border); margin-top: var(--space-3); padding-top: var(--space-3); }
  .op table { margin-top: var(--space-2); }
  .dot { width: 8px; height: 8px; border-radius: var(--radius-full); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--err); }
</style>
</head>
<body>
<div id="side">
  <h1>camcraft inspector</h1>
  <div id="drop">drop a <b>.json</b> from<br><span class="muted">camcraft job … --inspect</span><br>or click to choose</div>
  <input id="file" type="file" accept=".json" hidden>

  <div class="card" id="checks-card" hidden>
    <h2>Checks</h2>
    <div id="checks"></div>
  </div>

  <div class="card" id="job-card" hidden>
    <h2>Job</h2>
    <table id="job"></table>
  </div>

  <div class="card" id="ops-card" hidden>
    <h2>Operations</h2>
    <div id="ops"></div>
  </div>

  <div class="card" id="layers-card" hidden>
    <h2>Show</h2>
    <div id="layers"></div>
    <label style="margin-top:8px"><input type="checkbox" id="showPart" checked><span>part surface</span></label>
    <label><input type="checkbox" id="showStock"><span>stock outline</span></label>
    <label><input type="checkbox" id="showClear"><span>clearance ceiling</span></label>
    <label><input type="checkbox" id="showTool" checked><span>cutter at scrub position</span></label>
  </div>

  <div class="card" id="scrub-card" hidden>
    <h2>Move order</h2>
    <input type="range" id="scrub" min="1" max="1" value="1">
    <table>
      <tr><td>showing</td><td id="scrubLabel">–</td></tr>
      <tr><td>operation</td><td id="scrubOp">–</td></tr>
      <tr><td>move</td><td id="scrubMove">–</td></tr>
    </table>
  </div>
</div>

<div id="stage">
  <div id="hint">drag to orbit · wheel to zoom · shift-drag to pan · R resets · ← → step moves</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const ROLES = ['cut','rapid','plunge','retract','lead','ramp','link'];
const COLOR = {};
for (const r of ROLES) {
  COLOR[r] = getComputedStyle(document.documentElement)
    .getPropertyValue('--role-' + r).trim() || '#8B909D';
}

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0B0C0E);   // --bg
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.3);
key.position.set(0.6, -1, 1.4);
scene.add(key);

// Z-up, matching the engine's convention. Getting this wrong would make every
// reading of the picture wrong, so it is set once here and never flipped.
camera.up.set(0, 0, 1);

let group = null, home = null;

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();

addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') frame();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const s = document.getElementById('scrub');
    if (s.max <= 1 || document.activeElement === s) return;
    s.value = +s.value + (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 100 : 1);
    s.oninput && s.oninput();
  }
});

function frame() {
  if (!home) return;
  const { center, radius } = home;
  controls.target.copy(center);
  camera.position.set(center.x + radius * 1.4, center.y - radius * 1.7, center.z + radius * 1.2);
  camera.near = radius / 500; camera.far = radius * 100;
  camera.updateProjectionMatrix();
}

// ---- loading -------------------------------------------------------------

const drop = document.getElementById('drop');
const filePick = document.getElementById('file');
drop.onclick = () => filePick.click();
filePick.onchange = e => { if (e.target.files[0]) read(e.target.files[0]); };
for (const [ev, on] of [['dragover', true], ['dragleave', false], ['drop', false]]) {
  drop.addEventListener(ev, e => {
    e.preventDefault();
    drop.classList.toggle('hot', on);
    if (ev === 'drop' && e.dataTransfer.files[0]) read(e.dataTransfer.files[0]);
  });
}
// ?data=<url> loads directly, which makes a view reproducible and lets the
// inspector be driven from a script.
const q = new URLSearchParams(location.search).get('data');
if (q) {
  fetch(q).then(r => r.json()).then(d => build(d, q.split('/').pop()))
          .catch(e => { drop.textContent = 'could not load ' + q + ': ' + e.message; });
}

addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) read(e.dataTransfer.files[0]);
});

function read(file) {
  drop.textContent = 'reading ' + file.name + '…';
  const fr = new FileReader();
  fr.onload = () => {
    try { build(JSON.parse(fr.result), file.name); }
    catch (err) { drop.textContent = 'could not read: ' + err.message; }
  };
  fr.readAsText(file);
}

// Format 1 was one operation with `path` and `meta` at the top level, from the
// engine path that no longer exists. Old files still open, as one operation.
function normalise(data) {
  if (data.format === 2) return data;
  if (data.format !== undefined) throw new Error('unknown format ' + data.format);
  const m = data.meta || {};
  return {
    format: 2,
    part: data.part || {},
    job: {
      model: m.model, units: m.units, tolerance: m.tolerance, verified: m.verified,
      verify: { gouged: m.sim_gouged_columns, deepest_gouge_mm: m.sim_deepest_gouge_mm,
                leftover: m.sim_leftover_columns },
      warnings: m.warnings || [],
    },
    operations: [{
      name: 'finish', strategy: 'parallel',
      tool: { kind: String(m.tool || '').toLowerCase(), diameter: (m.tool_radius || 0) * 2 },
      stepover: m.stepover, stock_radial: m.stock_radial, stock_axial: m.stock_axial,
      max_cut_step: m.max_cut_step, clearance_z: m.clearance_z, passes: m.passes,
      suspicious_plunges: m.suspicious_plunges,
      detail: { kind: 'parallel', refinement_limited: m.refinement_limited,
                discontinuities: m.discontinuities, wall_breaks: m.wall_breaks,
                coverage_breaks: m.coverage_breaks },
      sim: { removed_mm3: m.sim_removed_mm3, rapid_contacts: m.sim_rapid_contacts,
             deepest_rapid_contact_mm: m.sim_deepest_rapid_contact_mm },
      cutting_length_mm: m.cutting_length_mm, verified: m.verified,
      warnings: [], path: data.path || [],
    }],
  };
}

// ---- building ------------------------------------------------------------

// Every segment of the whole program, in the order the machine runs it. A segment
// never joins the end of one operation to the start of the next: between them is a
// tool change, not a move.
let segments = [];    // { op, role, a, b }
let meshes = [];      // { op, role, mesh, order: global indices of its segments }
let opGroups = [];    // per operation: THREE.Group
let cutter = null;
let ops = [];

function build(raw, name) {
  const data = normalise(raw);
  if (group) { scene.remove(group); disposeAll(group); }
  group = new THREE.Group();
  scene.add(group);
  drop.innerHTML = '<b>' + esc(name) + '</b><br><span class="muted">click to load another</span>';

  const part = data.part || {};
  const job = data.job || {};
  ops = data.operations || [];

  // Part surface.
  const tri = Float32Array.from(part.triangles || []);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(tri, 3));
  geo.computeVertexNormals();
  const partMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: 0x585D6A, roughness: 0.85, metalness: 0.0,
    side: THREE.DoubleSide, flatShading: true,
  }));
  group.add(partMesh);

  // Toolpaths, one group per operation, split per role so each can be toggled.
  segments = []; meshes = []; opGroups = [];
  ops.forEach((op, oi) => {
    const g = new THREE.Group();
    g.userData.op = oi;
    opGroups.push(g);
    group.add(g);
    const first = segments.length;
    let at = null;
    for (const m of op.path || []) {
      const to = new THREE.Vector3(m.to[0], m.to[1], m.to[2]);
      if (at) segments.push({ op: oi, role: m.role, a: at, b: to, move: m });
      at = to;
    }
    for (const role of ROLES) {
      const pts = [], order = [];
      for (let i = first; i < segments.length; i++) {
        const s = segments[i];
        if (s.role === role) { pts.push(s.a, s.b); order.push(i); }
      }
      if (!pts.length) continue;
      const lg = new THREE.BufferGeometry().setFromPoints(pts);
      const mat = new THREE.LineBasicMaterial({ color: new THREE.Color(COLOR[role]) });
      const mesh = new THREE.LineSegments(lg, mat);
      mesh.userData.role = role;
      g.add(mesh);
      meshes.push({ op: oi, role, mesh, order });
    }

    // Each operation's clearance ceiling: where traverses fly over unknown ground.
    // Over known material they fly lower, by the clearance offset above it.
    if (typeof op.clearance_z === 'number') {
      const min = part.min || [0,0,0], max = part.max || [0,0,0];
      const w = (max[0]-min[0]) * 1.3 || 10, d = (max[1]-min[1]) * 1.3 || 10;
      const pm = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({
        color: 0x4FD1FF, transparent: true, opacity: 0.08, side: THREE.DoubleSide,
      }));
      pm.position.set((min[0]+max[0])/2, (min[1]+max[1])/2, op.clearance_z);
      pm.visible = document.getElementById('showClear').checked;
      pm.userData.clearance = true;
      g.add(pm);
    }
  });

  // The block of material, as an outline, so the part can be read against it.
  if (job.stock_min && job.stock_max) {
    const [x0, y0, z0] = job.stock_min, [x1, y1, z1] = job.stock_max;
    const box = new THREE.Box3(new THREE.Vector3(x0, y0, z0), new THREE.Vector3(x1, y1, z1));
    const helper = new THREE.Box3Helper(box, new THREE.Color(0x8B909D));
    helper.visible = document.getElementById('showStock').checked;
    helper.userData.stock = true;
    group.add(helper);
  }

  const min = part.min || [0,0,0], max = part.max || [0,0,0];
  const center = new THREE.Vector3((min[0]+max[0])/2, (min[1]+max[1])/2, (min[2]+max[2])/2);
  const radius = Math.max(max[0]-min[0], max[1]-min[1], max[2]-min[2]) || 10;
  home = { center, radius };
  frame();

  document.getElementById('showPart').onchange = e => { partMesh.visible = e.target.checked; };
  document.getElementById('showClear').onchange = e => {
    group.traverse(c => { if (c.userData.clearance) c.visible = e.target.checked; });
  };
  document.getElementById('showStock').onchange = e => {
    group.traverse(c => { if (c.userData.stock) c.visible = e.target.checked; });
  };
  document.getElementById('showTool').onchange = e => { if (cutter) cutter.visible = e.target.checked; };

  renderChecks(data);
  renderJob(job, part);
  renderOps();
  renderLayers();
  renderScrub();
}

function disposeAll(obj) {
  obj.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) o.material.dispose();
  });
}

// ---- verification --------------------------------------------------------

// A height field of the part, built from its triangles here rather than taken
// from the engine, so a check against it is a second opinion and not an echo.
function partHeights(part) {
  const t = part.triangles || [];
  const min = part.min, max = part.max;
  if (!t.length || !min || !max) return null;
  const span = Math.max(max[0] - min[0], max[1] - min[1]) || 1;
  const h = Math.max(span / 400, 0.05);
  const nx = Math.ceil((max[0] - min[0]) / h) + 1, ny = Math.ceil((max[1] - min[1]) / h) + 1;
  const z = new Float32Array(nx * ny).fill(-Infinity);
  const put = (i, j, v) => {
    if (i < 0 || j < 0 || i >= nx || j >= ny) return;
    const k = j * nx + i;
    if (v > z[k]) z[k] = v;
  };
  for (let o = 0; o < t.length; o += 9) {
    const ax = t[o], ay = t[o+1], az = t[o+2];
    const bx = t[o+3], by = t[o+4], bz = t[o+5];
    const cx = t[o+6], cy = t[o+7], cz = t[o+8];
    // Corners always land, so triangles smaller than a cell are never lost.
    put(Math.round((ax - min[0]) / h), Math.round((ay - min[1]) / h), az);
    put(Math.round((bx - min[0]) / h), Math.round((by - min[1]) / h), bz);
    put(Math.round((cx - min[0]) / h), Math.round((cy - min[1]) / h), cz);
    const den = (by - cy) * (ax - cx) + (cx - bx) * (ay - cy);
    if (Math.abs(den) < 1e-12) continue;   // vertical: its edges belong to its neighbours
    const i0 = Math.floor((Math.min(ax, bx, cx) - min[0]) / h), i1 = Math.ceil((Math.max(ax, bx, cx) - min[0]) / h);
    const j0 = Math.floor((Math.min(ay, by, cy) - min[1]) / h), j1 = Math.ceil((Math.max(ay, by, cy) - min[1]) / h);
    for (let j = j0; j <= j1; j++) {
      const py = min[1] + j * h;
      for (let i = i0; i <= i1; i++) {
        const px = min[0] + i * h;
        const l1 = ((by - cy) * (px - cx) + (cx - bx) * (py - cy)) / den;
        const l2 = ((cy - ay) * (px - cx) + (ax - cx) * (py - cy)) / den;
        const l3 = 1 - l1 - l2;
        if (l1 >= -1e-9 && l2 >= -1e-9 && l3 >= -1e-9) put(i, j, l1 * az + l2 * bz + l3 * cz);
      }
    }
  }
  return { z, nx, ny, h, x0: min[0], y0: min[1] };
}

// The same field, grown by a cutter's radius: the highest point of the part
// anywhere under the cutter's footprint. The cutter is treated as a flat-bottomed
// cylinder, which is conservative for a ball.
function dilate(f, radius) {
  const R = Math.ceil(radius / f.h);
  const out = new Float32Array(f.z.length).fill(-Infinity);
  const row = new Float32Array(f.nx), q = new Int32Array(f.nx);
  // A disc is a stack of rows, each a sliding maximum of its own half-width. The
  // monotonic queue makes each row linear, whatever the cutter's size.
  for (let dj = -R; dj <= R; dj++) {
    const w = Math.floor(Math.sqrt(Math.max(0, R * R - dj * dj)));
    for (let j = 0; j < f.ny; j++) {
      const sj = j + dj;
      if (sj < 0 || sj >= f.ny) continue;
      const base = sj * f.nx;
      let head = 0, tail = 0, next = 0;
      for (let i = 0; i < f.nx; i++) {
        for (; next <= Math.min(f.nx - 1, i + w); next++) {
          const v = f.z[base + next];
          while (tail > head && f.z[base + q[tail - 1]] <= v) tail--;
          q[tail++] = next;
        }
        while (q[head] < i - w) head++;
        row[i] = f.z[base + q[head]];
      }
      const o = j * f.nx;
      for (let i = 0; i < f.nx; i++) if (row[i] > out[o + i]) out[o + i] = row[i];
    }
  }
  return { ...f, z: out };
}

function rapidsThroughPart(f, path, radius) {
  if (!f) return null;
  const g = radius > 0 ? dilate(f, radius) : f;
  const at = (x, y) => {
    const i = Math.round((x - g.x0) / g.h), j = Math.round((y - g.y0) / g.h);
    if (i < 0 || j < 0 || i >= g.nx || j >= g.ny) return -Infinity;
    return g.z[j * g.nx + i];
  };
  let hits = 0, deepest = 0, prev = null;
  for (const m of path) {
    if (prev && m.role === 'rapid') {
      const [ax, ay, az] = prev.to, [bx, by, bz] = m.to;
      const n = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) / (g.h / 2)));
      let hit = 0;
      for (let k = 0; k <= n; k++) {
        const s = k / n;
        const over = at(ax + (bx - ax) * s, ay + (by - ay) * s) - (az + (bz - az) * s);
        if (over > 1e-3) hit = Math.max(hit, over);
      }
      if (hit > 0) { hits++; deepest = Math.max(deepest, hit); }
    }
    prev = m;
  }
  return { hits, deepest, pitch: g.h };
}

// These are re-derived here from the geometry, not copied from the engine's own
// report. A viewer that only echoed the producer's opinion of its output would
// agree with it even when both were wrong.
function checkOperation(op, heights) {
  const path = op.path || [];
  const out = [];
  const add = (level, code, message, location) => out.push({ level, code, message, location });

  // CC1xx are hard failures: the program must not be run.
  const links = path.filter(m => m.role === 'link').length;
  links === 0
    ? add('pass', 'CC101', 'no unresolved links')
    : add('fail', 'CC101', links + ' unresolved link(s) — path is NOT machinable');

  const radius = (op.tool && op.tool.diameter) ? op.tool.diameter / 2 : 0;
  const rp = rapidsThroughPart(heights, path, radius);
  if (rp) {
    rp.hits === 0
      ? add('pass', 'CC102', 'no rapid passes through the part',
            'cutter footprint ⌀' + (radius * 2).toFixed(2) + ' mm, part sampled at ' + rp.pitch.toFixed(2) + ' mm')
      : add('fail', 'CC102', rp.hits + ' rapid(s) pass through the part',
            'deepest ' + rp.deepest.toFixed(2) + ' mm under the cutter footprint');
  }

  let diagonal = 0, prev = null;
  for (const m of path) {
    if (prev && (m.role === 'plunge' || m.role === 'retract')) {
      if (Math.hypot(m.to[0] - prev.to[0], m.to[1] - prev.to[1]) > 1e-6) diagonal++;
    }
    prev = m;
  }
  diagonal === 0
    ? add('pass', 'CC103', 'plunges and retracts are vertical')
    : add('fail', 'CC103', diagonal + ' plunge/retract move(s) travel sideways',
          'drags the cutter through the wall it just cut');

  const nofeed = path.filter(m => m.role !== 'rapid' && !(m.feed > 0)).length;
  const rapidfeed = path.filter(m => m.role === 'rapid' && m.feed != null).length;
  nofeed === 0 && rapidfeed === 0
    ? add('pass', 'CC104', 'feed rates are consistent with move roles')
    : add('fail', 'CC104', nofeed + ' feeding move(s) without a feed, ' +
          rapidfeed + ' rapid(s) with one');

  let steep = 0, deepest = 0;
  prev = null;
  for (const m of path) {
    if (prev && m.role === 'cut') {
      const fall = prev.to[2] - m.to[2];
      const flat = Math.hypot(m.to[0] - prev.to[0], m.to[1] - prev.to[1]);
      if (fall > 0 && fall > flat * 10) { steep++; deepest = Math.max(deepest, fall); }
    }
    prev = m;
  }
  // Two conditions. Steepness alone is safe (a ball riding a smooth near-vertical
  // face descends faster than it advances and stays supported); depth alone is just
  // a cut. Dropping a long way while barely advancing engages the end of the cutter
  // instead of its side, and that is the thing that snaps bits.
  const allow = typeof op.max_cut_step === 'number' ? op.max_cut_step : 0.5;
  deepest <= allow
    ? add('pass', 'CC105', 'no cutting move descends past the allowance',
          'deepest ' + deepest.toFixed(3) + ' mm of ' + allow.toFixed(2) + ' mm allowed')
    : add('fail', 'CC105', 'deepest cutting descent ' + deepest.toFixed(2) +
          ' mm exceeds the ' + allow.toFixed(2) + ' mm allowance',
          steep + ' steep move(s) — a plunge at cutting feed will break cutters');

  // What the engine's simulator saw. Reported, not re-derived: the viewer has the
  // part but not the material, and only the simulator knows what was left standing.
  const sim = op.sim || {};
  if (typeof sim.rapid_contacts === 'number') {
    sim.rapid_contacts === 0
      ? add('pass', 'CC106', 'simulator: no rapid touched material')
      : add('fail', 'CC106', 'simulator: ' + sim.rapid_contacts + ' rapid(s) pass through material',
            'deepest ' + (sim.deepest_rapid_contact_mm ?? 0).toFixed(2) + ' mm');
  }

  // CC2xx are advisories: look, then decide.
  const d = op.detail || {};
  if (d.refinement_limited > 0) {
    add('warn', 'CC201', d.refinement_limited + ' span(s) hit the refinement limit',
        'path is coarser than the requested tolerance');
  }
  if (op.suspicious_plunges > 0) {
    add('warn', 'CC202', op.suspicious_plunges + ' plunge(s) do not start above the surface');
  }
  if (d.discontinuities > 0) {
    add('note', 'CC203', d.discontinuities + ' span(s) stopped at a surface discontinuity',
        'expected wherever the part has vertical walls');
  }
  if (d.wall_breaks > 0) {
    add('note', 'CC204', d.wall_breaks + ' pass(es) broken at a wall',
        'each is a plunge turned into a retract and a controlled re-entry');
  }
  if (d.kind === 'zlevel-rough' && d.rings === 0) {
    add('warn', 'CC205', 'roughing found nothing to clear',
        'the stock may already be below this operation\'s top');
  }
  for (const w of (op.warnings || [])) {
    if (!/descent|refinement limit|do not start above|rapid move|nothing to clear|unresolved links/.test(w)) {
      add('warn', 'CC299', w);
    }
  }
  return out;
}

function renderChecks(data) {
  const job = data.job || {};
  const heights = partHeights(data.part || {});
  const groups = [];

  // Job-wide: how the finished material compares with the part.
  const jobOut = [];
  const v = job.verify || {};
  if (typeof v.gouged === 'number') {
    v.gouged === 0
      ? jobOut.push({ level: 'pass', code: 'CC107', message: 'simulator: finished stock is nowhere below the part',
          location: (v.compared ?? 0).toLocaleString() + ' column(s) compared' +
            (typeof v.budget_mm === 'number' ? ', budget ' + v.budget_mm.toFixed(3) + ' mm' : '') })
      : jobOut.push({ level: 'fail', code: 'CC107', message: 'simulator: finished stock is below the part in ' +
          v.gouged + ' column(s)', location: 'deepest ' + (v.deepest_gouge_mm ?? 0).toFixed(3) + ' mm' });
  }
  if (v.leftover > 0) {
    jobOut.push({ level: 'note', code: 'CC206', message: v.leftover.toLocaleString() +
      ' column(s) left more than 1 mm above the part',
      location: typeof v.tallest_leftover_mm === 'number'
        ? 'tallest ' + v.tallest_leftover_mm.toFixed(2) + ' mm — where the cutter could not reach' : '' });
  }
  if (jobOut.length) groups.push({ title: 'job', diags: jobOut });
  ops.forEach(op => groups.push({ title: op.name, diags: checkOperation(op, heights) }));

  const failed = groups.reduce((n, g) => n + g.diags.filter(d => d.level === 'fail').length, 0);
  const banner = failed > 0
    ? '<div class="diag fail"><span class="lvl">HALT</span><span class="msg">' +
      failed + ' blocking failure(s). Do not run this program.</span></div>'
    : '';

  document.getElementById('checks').innerHTML = banner + groups.map(g =>
    (groups.length > 1 ? '<div class="op-head">' + esc(g.title) + '</div>' : '') +
    g.diags.map(d =>
      '<div class="diag ' + d.level + '">' +
        '<span class="lvl">' + d.level + '</span>' +
        '<div><div class="msg"><code>' + d.code + '</code>' + esc(d.message) + '</div>' +
        (d.location ? '<div class="muted" style="font-family:var(--font-mono);font-size:var(--text-xs);margin-top:2px">' +
          esc(d.location) + '</div>' : '') +
      '</div></div>').join('')
  ).join('');
  document.getElementById('checks-card').hidden = false;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}

const mm = (v, p = 2) => typeof v === 'number' ? v.toFixed(p) + ' mm' : '–';

function renderJob(job, part) {
  const size = (a, b) => a && b
    ? (b[0]-a[0]).toFixed(1) + ' × ' + (b[1]-a[1]).toFixed(1) + ' × ' + (b[2]-a[2]).toFixed(1) + ' mm'
    : '–';
  const rows = [
    ['model', (job.model || '').split(/[\\/]/).pop()],
    ['file units', job.units],
    ['part', size(part.min, part.max)],
    ['stock', size(job.stock_min, job.stock_max)],
    ['triangles', (part.triangle_count ?? 0).toLocaleString()],
    ['tolerance', mm(job.tolerance, 3)],
    ['work offset', job.wcs ? 'G' + job.wcs : '–'],
    ['verified', job.verified === true ? 'yes' : job.verified === false ? 'NO' : '–'],
  ];
  document.getElementById('job').innerHTML = rows
    .map(([k, v]) => '<tr><td>' + esc(k) + '</td><td>' + esc(v ?? '–') + '</td></tr>').join('');
  document.getElementById('job-card').hidden = false;
}

function renderOps() {
  const el = document.getElementById('ops');
  el.innerHTML = ops.map((op, oi) => {
    const t = op.tool || {};
    const d = op.detail || {};
    const rows = [
      ['tool', (t.number ? 'T' + t.number + ' ' : '') + (t.kind || '') + ' ⌀' + (t.diameter ?? 0).toFixed(2) +
        (t.kind === 'bullnose' ? ' r' + (t.corner ?? 0).toFixed(2) : '')],
      ['stepover', mm(op.stepover)],
      ['stock r/a', (op.stock_radial ?? 0) + ' / ' + (op.stock_axial ?? 0) + ' mm'],
      ['clearance', typeof op.clearance_offset === 'number'
        ? '+' + op.clearance_offset + ' over material, ceiling ' + mm(op.clearance_z) : mm(op.clearance_z)],
      ['max cut step', mm(op.max_cut_step)],
      [d.kind === 'zlevel-rough' ? 'rings' : 'passes', op.passes],
      d.kind === 'zlevel-rough' ? ['levels', d.levels] : ['wall breaks', d.wall_breaks ?? 0],
      ['moves', (op.path || []).length.toLocaleString()],
      ['cutting', typeof op.cutting_length_mm === 'number' ? op.cutting_length_mm.toFixed(0) + ' mm' : '–'],
      ['removed', op.sim && typeof op.sim.removed_mm3 === 'number'
        ? (op.sim.removed_mm3 / 1000).toFixed(1) + ' cm³' : '–'],
      ['travel saved', typeof op.travel_saved === 'number' ? (op.travel_saved * 100).toFixed(0) + '%' : '–'],
    ];
    return '<div class="op">' +
      '<label><input type="checkbox" data-op="' + oi + '" checked>' +
      '<span class="dot ' + (op.verified === false ? 'bad' : 'ok') + '"></span>' +
      '<span>' + (oi + 1) + '. ' + esc(op.name) + '</span>' +
      '<span class="count">' + esc(op.strategy || '') + '</span></label>' +
      '<table>' + rows.map(([k, v]) =>
        '<tr><td>' + esc(k) + '</td><td>' + esc(v ?? '–') + '</td></tr>').join('') + '</table></div>';
  }).join('');
  el.querySelectorAll('input[data-op]').forEach(cb => {
    cb.onchange = () => { const g = opGroups[+cb.dataset.op]; if (g) g.visible = cb.checked; };
  });
  document.getElementById('ops-card').hidden = false;
}

function renderLayers() {
  const counts = {};
  for (const s of segments) counts[s.role] = (counts[s.role] || 0) + 1;
  const el = document.getElementById('layers');
  el.innerHTML = ROLES.filter(r => counts[r]).map(r =>
    '<label><input type="checkbox" data-role="' + r + '" checked>' +
    '<span class="sw" style="background:' + COLOR[r] + '"></span>' +
    '<span>' + r + '</span>' +
    '<span class="count">' + counts[r].toLocaleString() + '</span></label>'
  ).join('');
  el.querySelectorAll('input').forEach(cb => {
    cb.onchange = () => {
      for (const m of meshes) if (m.role === cb.dataset.role) m.mesh.visible = cb.checked;
    };
  });
  document.getElementById('layers-card').hidden = false;
}

// The cutter drawn where the scrub stands, so order and reach can be read together.
function makeCutter(tool) {
  const r = (tool && tool.diameter ? tool.diameter / 2 : 1) || 1;
  const len = r * 4;
  const mat = new THREE.MeshStandardMaterial({ color: 0xE8B04A, transparent: true, opacity: 0.55 });
  let geo;
  if (tool && tool.kind === 'ball') {
    geo = new THREE.CapsuleGeometry(r, len, 6, 24);
    geo.translate(0, len / 2 + r, 0);        // tip of the lower hemisphere at the origin
  } else {
    geo = new THREE.CylinderGeometry(r, r, len, 24);
    geo.translate(0, len / 2, 0);            // flat bottom at the origin
  }
  geo.rotateX(Math.PI / 2);                  // three's Y-up geometry into the Z-up scene
  const m = new THREE.Mesh(geo, mat);
  m.visible = document.getElementById('showTool').checked;
  return m;
}

// Scrubbing through move order is how you catch a path that is geometrically
// fine but travels in a senseless sequence. It runs across every operation in
// program order.
function renderScrub() {
  const scrub = document.getElementById('scrub');
  const label = document.getElementById('scrubLabel');
  const opLabel = document.getElementById('scrubOp');
  const moveLabel = document.getElementById('scrubMove');
  const cutters = ops.map(op => makeCutter(op.tool));
  cutters.forEach(c => { c.visible = false; group.add(c); });
  scrub.min = 1; scrub.max = Math.max(1, segments.length); scrub.value = scrub.max;
  const upTo = (order, n) => {           // how many of `order` are below n
    let lo = 0, hi = order.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (order[mid] < n) lo = mid + 1; else hi = mid; }
    return lo;
  };
  const apply = () => {
    const n = Math.min(+scrub.value, segments.length);
    for (const m of meshes) m.mesh.geometry.setDrawRange(0, upTo(m.order, n) * 2);
    label.textContent = n.toLocaleString() + ' / ' + segments.length.toLocaleString();
    const s = segments[n - 1];
    cutters.forEach(c => { c.visible = false; });
    if (!s) { opLabel.textContent = moveLabel.textContent = '–'; return; }
    const op = ops[s.op];
    opLabel.textContent = (s.op + 1) + '. ' + op.name;
    moveLabel.textContent = s.role + ' to ' + s.b.x.toFixed(2) + ', ' + s.b.y.toFixed(2) + ', ' +
      s.b.z.toFixed(2) + (s.move.feed ? ' F' + s.move.feed : '');
    cutter = cutters[s.op];
    cutter.position.copy(s.b);
    cutter.visible = document.getElementById('showTool').checked && n < segments.length;
  };
  scrub.oninput = apply;
  apply();
  document.getElementById('scrub-card').hidden = false;
}
</script>
