# GRBL, and the many senders that speak it.
#
# Deliberately more conservative than the Masso profile: GRBL builds vary, parsing
# is stricter, and line length matters on slow serial links. Trailing zeros are
# stripped to keep blocks short, and no tool changer is assumed -- M6 pauses for a
# manual change on most setups, so the program stops and says what to fit.

name      = "GRBL"
extension = "nc"
comment   = ["(", ")"]

arc_style   = "ij"
tool_change = "pause"

header = [
  "({name})",
  "(generated by camcraft -- verify before running)",
  "G90 G94 G17",
]

footer = [
  "M30",
]

[format]
axis_decimals        = 3
feed_decimals        = 0
strip_trailing_zeros = true

[numbering]
enabled = false

[modal]
suppress_motion = true
suppress_axes   = true
suppress_feed   = true
