# Masso G3 / G2 controllers.
#
# Built from the controller's documented G-code reference. VALIDATE ON THE MACHINE
# with a dry run well above the work before trusting it on material -- a post that
# has only ever been read is a post that has never been tested.

name      = "Masso"
extension = "nc"
comment   = ["(", ")"]

arc_style   = "ij"
tool_change = "m6"
# Masso documents G81, G82, G83 and G80. Off until they have been dry-run on the
# machine; off, a drilling operation is posted as plain moves instead.
drill_cycles = false

header = [
  "({name})",
  "(generated by camcraft -- verify before running)",
  "G90 G94 G17",
]

footer = [
  "M30",
]

[format]
axis_decimals        = 3
feed_decimals        = 1
strip_trailing_zeros = false

[numbering]
enabled = false

[modal]
suppress_motion = true
suppress_axes   = true
suppress_feed   = true
