# Centroid CNC12 on an Avid CNC router (the EX control), programs written in
# inches: the centroid-avid profile with `units = "inch"`, which writes G20 and
# converts every length and feed, and feeds to a tenth as Fusion's Avid post
# writes them in inches. Kept the same as centroid-avid.toml in everything else.
#
# Written as Avid's own Fusion post for CNC12 writes programs ("Avid CNC EX
# Router", avidcnc-ex-posts-for-fusion-1.0, the post Avid recommends with CNC12):
# `.tap` files, no line numbers, numbers without trailing zeros or a bare point,
# comments in capitals holding only what that post lets through, and the tool's
# length offset taken up with the first move down after the change.
#
# VALIDATE ON THE MACHINE with a dry run well above the work before trusting it
# on material -- a post that has only ever been read is a post that has never been
# tested.

name      = "Centroid CNC12 (Avid CNC, inch)"
extension = "tap"
comment   = ["(", ")"]
# What Fusion's Avid post lets into a comment. The brackets that stand in for a
# stray parenthesis are left out with everything else.
comment_chars = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,=_-"
comment_upper = true

arc_style   = "ij"
tool_change = "m6"
# Avid's CNC12 measures each tool on the tool height setter at its M6, and keeps
# the length under the tool's number: `G43 Z.. H<tool>` takes it up.
length_offset = true
# Avid's post writes G81, G82 and G83 with G98. Off until they have been dry-run
# on the machine; off, a drilling operation is posted as plain moves instead.
drill_cycles = false

units = "inch"

header = [
  "({name})",
  "(GENERATED BY CAMCRAFT -- VERIFY BEFORE RUNNING)",
  "G90 G94 G40 G49 G17",
]

# Z to its home at the top before the tool change and at the end, as Avid's
# posts do ("G53 Z0", "Move to Z home"), then across to the work origin, where
# Fusion's Avid post ends.
safe_retract = ["G53 G0 Z0"]
end_home     = ["G0 X0 Y0"]

footer = [
  "M30",
]

[format]
axis_decimals        = 3
inch_axis_decimals   = 4
feed_decimals        = 1
strip_trailing_zeros = true

[numbering]
enabled = false

[modal]
suppress_motion = true
suppress_axes   = true
suppress_feed   = true
