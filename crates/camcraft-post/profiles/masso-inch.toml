# Masso G3 / G2 controllers, programs written in inches: the Masso profile with
# `units = "inch"`, which writes G20 and converts every length and feed. Kept the
# same as masso.toml in everything else (a test in src/profile.rs checks it).
#
# Built from the controller's documented G-code reference. VALIDATE ON THE MACHINE
# with a dry run well above the work before trusting it on material -- a post that
# has only ever been read is a post that has never been tested.

name      = "Masso (inch)"
extension = "nc"
comment   = ["(", ")"]

arc_style   = "ij"
tool_change = "m6"
# Masso documents G81, G82, G83 and G80. Off until they have been dry-run on the
# machine; off, a drilling operation is posted as plain moves instead.
drill_cycles = false

units = "inch"

header = [
  "({name})",
  "(generated by camcraft -- verify before running)",
  "G90 G94 G17",
]

# Straight up to Z home, as Fusion's Masso post does, before a tool change and at
# the end; then home across.
safe_retract = ["G28 G91 Z0", "G90"]
end_home     = ["G28 G91 X0 Y0", "G90"]

footer = [
  "M30",
]

# Written as Fusion's Masso post writes them: `Z2.2`, `I0.`, `F150.`, and blocks
# numbered from N10 in fives, comments not.
[format]
axis_decimals        = 3
inch_axis_decimals   = 4
feed_decimals        = 1
strip_trailing_zeros = true
keep_point           = true

[numbering]
enabled   = true
start     = 10
increment = 5

[modal]
suppress_motion = true
suppress_axes   = true
suppress_feed   = true
