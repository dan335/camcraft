<!-- @dsCard group="Colors" viewport="700x120" name="Neutral scale" subtitle="Graphite surfaces gray-0 → gray-10; borders at 4, text from 6 up" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg)}body{padding:16px;box-sizing:border-box;width:700px;height:120px;overflow:hidden}.row{display:flex;gap:8px}.sw{flex:1;height:64px;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font:11px/1.3 var(--font-mono);color:var(--text-3)}.sw b{color:var(--text-1);font-weight:500}.lab{font:11px var(--font-mono);color:var(--text-3);text-transform:uppercase;letter-spacing:.06em}</style></head><body><div class="row"><div class="sw" style="background:#0B0C0E;height:80px;box-shadow:0 0 0 1px var(--border);"><b style="">0</b></div><div class="sw" style="background:#111216;height:80px;box-shadow:0 0 0 1px var(--border);"><b style="">1</b></div><div class="sw" style="background:#17181D;height:80px;box-shadow:0 0 0 1px var(--border);"><b style="">2</b></div><div class="sw" style="background:#1F2127;height:80px;box-shadow:0 0 0 1px var(--border);"><b style="">3</b></div><div class="sw" style="background:#2A2D35;height:80px;box-shadow:0 0 0 1px var(--border);"><b style="">4</b></div><div class="sw" style="background:#3A3E48;height:80px;box-shadow:0 0 0 1px var(--border);"><b style="">5</b></div><div class="sw" style="background:#585D6A;height:80px;box-shadow:0 0 0 1px var(--border);"><b style="">6</b></div><div class="sw" style="background:#8B909D;height:80px;box-shadow:0 0 0 1px var(--border);color:rgba(0,0,0,.55)"><b style="color:#0B0C0E">7</b></div><div class="sw" style="background:#B9BDC7;height:80px;box-shadow:0 0 0 1px var(--border);color:rgba(0,0,0,.55)"><b style="color:#0B0C0E">8</b></div><div class="sw" style="background:#E6E8EE;height:80px;box-shadow:0 0 0 1px var(--border);color:rgba(0,0,0,.55)"><b style="color:#0B0C0E">9</b></div><div class="sw" style="background:#F7F8FA;height:80px;box-shadow:0 0 0 1px var(--border);color:rgba(0,0,0,.55)"><b style="color:#0B0C0E">10</b></div></div></body></html>
