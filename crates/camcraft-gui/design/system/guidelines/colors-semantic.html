<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg)}body{padding:16px;box-sizing:border-box;width:700px;height:150px;overflow:hidden}.row{display:flex;gap:8px}.sw{flex:1;height:64px;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font:11px/1.3 var(--font-mono);color:var(--text-3)}.sw b{color:var(--text-1);font-weight:500}.lab{font:11px var(--font-mono);color:var(--text-3);text-transform:uppercase;letter-spacing:.06em}</style></head><body><div style="background:var(--bg);padding:12px;box-shadow:0 0 0 1px var(--border);border-radius:2px"><div class="lab">bg</div><div style="background:var(--surface-1);padding:12px;margin-top:6px;border:1px solid var(--border);border-radius:2px"><div class="lab">surface-1</div><div style="background:var(--surface-2);padding:12px;margin-top:6px;border:1px solid var(--border);border-radius:2px;display:flex;gap:24px;align-items:baseline"><span class="lab">surface-2</span><span style="color:var(--text-1)">text-1</span><span style="color:var(--text-2)">text-2</span><span style="color:var(--text-3)">text-3</span><span style="color:var(--text-4)">text-4</span><span style="color:var(--text-accent)">text-accent</span></div></div></div></body></html>
