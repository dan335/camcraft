<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg)}body{padding:16px;box-sizing:border-box;width:700px;height:120px;overflow:hidden}.row{display:flex;gap:8px}.sw{flex:1;height:64px;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font:11px/1.3 var(--font-mono);color:var(--text-3)}.sw b{color:var(--text-1);font-weight:500}.lab{font:11px var(--font-mono);color:var(--text-3);text-transform:uppercase;letter-spacing:.06em}</style></head><body><div class="row"><div class="sw" style="background:#FFE1A3;color:rgba(0,0,0,.6)"><b style="color:#0B0C0E">amber-3 hover</b>#FFE1A3</div><div class="sw" style="background:#F5A524;color:rgba(0,0,0,.6)"><b style="color:#0B0C0E">amber-5 accent</b>#F5A524</div><div class="sw" style="background:#D98A0F;color:rgba(0,0,0,.6)"><b style="color:#0B0C0E">amber-6 press</b>#D98A0F</div><div class="sw" style="background:#8A5806;"><b style="">amber-7</b>#8A5806</div><div class="sw" style="background:var(--accent-subtle);box-shadow:0 0 0 1px var(--border)"><b>accent-subtle</b>12% alpha</div></div></body></html>
