[package]
name        = "camcraft-import"
description = "Model import for camcraft: STL and STEP to triangle meshes."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[features]
# OpenCascade, the STEP kernel before ogeom, as `step::opencascade`, to cross-check
# ogeom against. Builds OpenCascade from source: needs cmake and a C++ toolchain.
opencascade = ["dep:opencascade"]

[dependencies]
camcraft-geom.workspace = true
glam.workspace          = true
ogeom-core.workspace    = true
ogeom-geom.workspace    = true
ogeom-io.workspace      = true
ogeom-math.workspace    = true
ogeom-mesh.workspace    = true
ogeom-topo.workspace    = true
opencascade             = { workspace = true, optional = true }
spade.workspace         = true
step-check.workspace    = true
stl_io.workspace        = true
thiserror.workspace     = true

[lints]
workspace = true
